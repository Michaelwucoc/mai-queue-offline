# Koishi 配置文件示例

plugins:
  mai-queue:
    defaultMachineCount: 5
    defaultPlayTimePerPerson: 15
    playersPerMachine: 2
    nearcadeApiToken: ""
    nearcadeBaseUrl: "https://nearcade.cn"
    nearcadeBotName: "mai-queue"
    # —— 天气预报（可选）——
    enableWeather: true                 # 全局开启
    weatherLookAheadHours: 4            # 查卡关注未来几小时
    weatherCacheMinutes: 15
    weatherAlertPollMinutes: 30         # 预警轮询间隔
    enableWeatherDailyDigest: true      # 订阅群每日早间摘要
    weatherDailyDigestHour: 10          # 默认 10:00
    qweatherApiKey: ""
    qweatherApiHost: ""                   # 和风控制台项目专属域名
    # JWT 认证（推荐，与 API Key 二选一）
    qweatherProjectId: ""
    qweatherCredentialId: ""
    qweatherPrivateKey: ""
    qweatherAuthMode: auto
    debug: false
    arcades:
      wujiaochang:
        config:
          name: 上海五角场百联 ZX 造趣场 AKIBAGO
          aliases: [wjc, 五角场]
          machineCount: 5
          notice: 冬暖夏暖，记得备短袖
          groupWhitelist: ["123456789"]
          enableNearcade: false
          nearcadeId: 0
          # 方式 A：经纬度（最准）
          weatherLatitude: 31.298
          weatherLongitude: 121.514

      youfang:
        config:
          name: 悠方星河奇迹体验馆
          aliases: [yf, 悠方]
          machineCount: 4
          notice: 欢迎来到悠方店！
          groupWhitelist: []
          enableNearcade: true
          nearcadeId: 16342
          nearcadeTitleId: 1
          # 方式 B：城市 + 区（区可选；有区则优先区中心）
          weatherCity: 上海
          weatherDistrict: 嘉定

      liehuo:
        config:
          name: 街机烈火
          aliases: [lh, 烈火]
          machineCount: 8
          address: 上海市静安区江宁路77号恒顺大楼4层
          directionGuide: |
            南京西路地铁站1口步行430米
          notice: 欢迎来到烈火！
          groupWhitelist: []
          enableNearcade: true
          nearcadeId: 10001
          weatherCity: 上海
          weatherDistrict: 静安
          # enableWeather: false        # 可单独关闭某厅天气
