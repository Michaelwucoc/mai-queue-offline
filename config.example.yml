# Koishi 配置文件示例
# 舞萌DX排卡状态报告插件配置

plugins:
  mai-queue:
    # 默认机台数量
    defaultMachineCount: 5
    # 平均每人游玩时间（分钟）
    defaultPlayTimePerPerson: 15
    # 每台机器可同时游玩人数
    playersPerMachine: 2
    # TurboAPI授权密钥（格式：BotKey <key>，留空则不使用TurboAPI）
    # 例如：979c5f40-130f-4246-94bd-6b2973040b5e
    turboApiKey: ""
    # 机厅数据
    arcades:
      # 机厅ID（唯一标识）
      wujiaochang:
        config:
          # 机厅名称
          name: 上海五角场百联 ZX 造趣场 AKIBAGO
          # 别名列表（支持多个别名）
          aliases:
            - wjc
            - wujiaochang
            - 五角场
          # 机台数量
          machineCount: 5
          # 店铺通知
          notice: 冬暖夏暖，记得备短袖。最近已改良通风！
          # 群白名单（为空则允许所有群）
          groupWhitelist:
            - "123456789"
            - "987654321"
          # 是否启用Turbo兼容（需要配置turboApiKey和turboName）
          enableTurbo: false
          # Turbo机厅名称（启用Turbo时必填，需要与Turbo系统中的机厅名称一致）
          turboName: ""
          # 是否启用小情侣报卡
          enableCoupleReport: false
          # 小情侣报卡绑定群号列表（可多选，例如：["123456789", "987654321"]）
          coupleGroupWhitelist: []
          # 自定义查询消息模板（可选，留空使用默认模板）
          # 可用变量：{name}, {currentCount}, {machineCount}, {updateTime}, {updaterName}, {updaterId}, {updaterInfo}, {notice}, {waitTime}, {nextPlayTime}, {minutesAgo}, {xql_num}
          # Turbo变量（仅当enableTurbo为true时可用）：
          #   - {thirtyMinutesPlayer}, {oneHourPlayer}, {twoHoursPlayer} - 玩家数
          #   - {thirtyMinutesPlayCount}, {oneHourPlayCount}, {twoHoursPlayCount} - 游玩次数
          #   - {recentPlayername}, {recentPlayername_thirty} - 玩家列表（每行前面两个空格）
          #   - {arcadePlayCount}, {arcadeRequested}, {arcadeCachedRequest}, {arcadeFixedRequest} - 机厅统计数据
          #   - {arcadeCachedHitRate} - 缓存命中率（自动转换为百分比，如：64.92%）
          # 情侣报卡变量：
          #   - {xql_num} - 小情侣对数（单独计算）
          # queryMessageTemplate: |
          #   → OK！查到了！
          #   
          #   - {name}
          #   目前人数: {currentCount} 人
          #   机台数量: {machineCount} 台
          #   更新时间: {updateTime}
          #   更新玩家: {updaterName}({updaterId})
          #   店铺通知: {notice}
          #   现在出勤大约需要 {waitTime} 分钟才能上机
          #   
          #   若是刚刚下机，
          #   从上次上机到下次大约需要 {nextPlayTime} 分钟
        # 注意：status字段（当前人数、更新时间等）是运行时数据，会自动更新，不需要在配置中设置
      
      # 另一个机厅示例
      youfang:
        config:
          name: 悠方店
          aliases:
            - yf
            - youfang
            - 悠方
          machineCount: 4
          notice: 欢迎来到悠方店！
          groupWhitelist: []  # 空列表表示所有群都可以使用
          enableTurbo: false
          turboName: ""
          # 启用小情侣报卡示例
          enableCoupleReport: true
          coupleGroupWhitelist:
            - "123456789"  # 只有在这个群里输入xql+1或xql-1才会给悠方机厅+2或-2人
        # 注意：status字段（当前人数、更新时间等）是运行时数据，会自动更新，不需要在配置中设置
      
      # Turbo机厅示例
      liehuo:
        config:
          name: 上海街机烈火
          aliases:
            - lh
            - liehuo
            - 烈火
          machineCount: 8
          notice: 欢迎来到烈火！
          groupWhitelist: []
          # 启用Turbo兼容
          enableTurbo: true
          # Turbo系统中的机厅名称（必须与Turbo系统中的名称完全一致）
          turboName: "上海街机烈火"
          # 自定义模板示例（使用Turbo变量）
          queryMessageTemplate: |
            → OK！查到了！
            
            - {name}
            目前人数: {currentCount} 人 ({minutesAgo} 分钟前)
            机台数量: {machineCount} 台
            更新时间: {updateTime}
            更新玩家: {updaterInfo}
            
            [Turbo数据]
            30分钟玩家数: {thirtyMinutesPlayer}
            1小时玩家数: {oneHourPlayer}
            2小时玩家数: {twoHoursPlayer}
            30分钟游玩次数: {thirtyMinutesPlayCount}
            1小时游玩次数: {oneHourPlayCount}
            2小时游玩次数: {twoHoursPlayCount}
            
            机厅游玩次数: {arcadePlayCount}
            机厅请求数: {arcadeRequested}
            缓存请求数: {arcadeCachedRequest}
            固定请求数: {arcadeFixedRequest}
            缓存命中率: {arcadeCachedHitRate}
            
            最近玩家:
            {recentPlayername}
            
            最近30分钟玩家:
            {recentPlayername_thirty}
        # 注意：status字段（当前人数、更新时间等）是运行时数据，会自动更新，不需要在配置中设置



